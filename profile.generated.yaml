feedback_preferences:
  common_skip_reasons:
    too_junior: Role is below senior/staff scope or emphasizes learning over ownership.
    wrong_location: Location, timezone, onsite, hybrid, or work authorization constraints do not fit.
    too_frontend: Role is primarily frontend UI implementation with limited backend/platform depth.
    too_mobile: Role is primarily iOS/Android/mobile app work.
    too_hardware: Role focuses on hardware, embedded systems, robotics, or device integration.
    too_management_heavy: Role is primarily people management, process, planning, or coordination.
    compensation_too_low: Disclosed compensation is below configured minimums.
    equity_only: Role is unpaid, equity-only, or compensation is not credible.
    domain_not_interesting: Domain is low-interest or explicitly avoided.
    vague_post: Post lacks enough concrete role, stack, company, location, or compensation detail.
  ranking_style: ruthless
